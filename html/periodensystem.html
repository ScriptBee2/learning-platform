<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chemie – Periodensystem</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../lib/hamster/hamster.css">
  <link rel="stylesheet" href="../css/periodensystem.css">
  <link rel="stylesheet" href="../css/explainer.css">
</head>
<body class="page page--fit page--with-sidebar">
  <a class="back" href="chemie.html">&#8592; Zurück</a>

  <header class="topbar">
    <div class="topbar__row">
      <h1 class="topbar__title">Periodensystem</h1>
      <span class="topbar__hint">&#128073; Element antippen für Details</span>
    </div>
  </header>

  <main class="ptable-wrap">
    <div class="ptable" id="ptable"></div>
  </main>

  <!-- Banner im Bindungsmodus -->
  <div class="bondbar" id="bondbar" hidden>
    <span class="bondbar__text" id="bondbarText"></span>
    <button type="button" class="bondbar__cancel" id="bondCancel">Beenden</button>
  </div>

  <!-- Info-Panel rechts, auf-/zuklappbar -->
  <aside class="sidebar" id="sidebar">
    <button type="button" class="sidebar__toggle" id="sidebarToggle" aria-label="Panel auf-/zuklappen" aria-controls="sidebar">&rsaquo;</button>
    <div class="sidebar__content">
      <section class="panel">
        <h2 class="panel__title">Lernkarten</h2>
        <div class="card-stack" id="cards"></div>
      </section>

      <section class="panel">
        <h2 class="panel__title">Bindung bauen</h2>
        <button type="button" class="btn btn--block" id="bondBtn">Bindung bauen</button>
      </section>

      <section class="panel accent-green">
        <h2 class="panel__title">Element-Quiz</h2>
        <button type="button" class="btn btn--primary btn--block" id="quizBtn">Quiz starten</button>
      </section>
    </div>
  </aside>

  <!-- Detail-Panel: Elementzelle im Tafelwerk-Stil -->
  <div class="overlay" id="overlay" hidden>
    <div class="dialog dialog--sm detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dName">
      <button type="button" class="close" id="closeBtn" aria-label="Schließen">&times;</button>

      <div class="tcell" id="tcell">
        <span class="tcell__z tip" id="dNumber" data-tip="Ordnungszahl = Anzahl der Protonen."></span>
        <span class="tcell__mass tip tip--end" id="dMass" data-tip="Atommasse in u."></span>
        <span class="tcell__en tip" id="dEN" data-tip="Elektronegativität (Pauling-Skala)."></span>
        <span class="tcell__sym" id="dSymbol"></span>
        <span class="tcell__name" id="dName"></span>
      </div>

      <dl class="facts">
        <div><dt class="tip" data-tip="Durchschnittliche Masse eines Atoms (in u).">Atommasse</dt><dd id="lMass"></dd></div>
        <div><dt class="tip tip--end" data-tip="Wie stark das Atom Bindungselektronen anzieht.">Elektronegativität</dt><dd id="lEN"></dd></div>
        <div><dt class="tip" data-tip="Spalte im PSE. Bei Hauptgruppen gibt sie die Anzahl der Außenelektronen an.">Gruppe</dt><dd id="lGroup"></dd></div>
        <div><dt class="tip tip--end" data-tip="Zeile im PSE. Sie gibt die Anzahl der Elektronenschalen an.">Periode</dt><dd id="lPeriod"></dd></div>
        <div class="facts__wide"><dt class="tip" data-tip="Stoffgruppe, zu der das Element gehört.">Kategorie</dt><dd id="lCat"></dd></div>
      </dl>

      <div class="lewis" id="lewisBox">
        <div class="lewis__col">
          <h3 class="lewis__title tip" data-tip="Die Außenelektronen als Punkte um das Symbol: erst einzeln, dann paarweise.">Lewis-Schreibweise</h3>
          <div class="lewis__fig" id="lewisFig"></div>
        </div>
        <div class="lewis__col">
          <h3 class="lewis__title tip tip--end" data-tip="Kurzschrift der Lewis-Schreibweise: Jedes Paar wird ein Strich.">Valenzstrich-Formel</h3>
          <div class="lewis__fig" id="valenceFig"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Ergebnis des Bindungsmodus -->
  <div class="overlay" id="bondOverlay" hidden>
    <div class="dialog bonddetail accent-cyan" role="dialog" aria-modal="true" aria-labelledby="bondTitle">
      <button type="button" class="close" id="bondClose" aria-label="Zurück">&times;</button>
      <h2 class="bonddetail__title" id="bondTitle"></h2>
      <span class="bond-badge" id="bondType"></span>
      <div class="bond-figs" id="bondFigs"></div>
      <p class="bond-explain" id="bondExplain"></p>
      <div class="btn-stack">
        <button type="button" class="btn btn--primary btn--block" id="bondAgain">Weitere Bindung</button>
        <button type="button" class="btn btn--block" data-explain="oktettregel">Oktettregel Schritt für Schritt</button>
      </div>
    </div>
  </div>

  <!-- Lernkarten-Overlay: große Karte (Einzel- oder Übungsmodus) -->
  <div class="overlay" id="cardOverlay" hidden>
    <div class="dialog dialog--sm bigcard" id="bigcard" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
      <button type="button" class="close close--on-accent" id="cardClose" aria-label="Schließen">&times;</button>
      <div class="bigcard__title" id="cardTitle"></div>
      <div class="bigcard__body prose" id="cardBody"></div>
    </div>
  </div>

  <!-- Element-Quiz -->
  <div class="overlay" id="quizOverlay" hidden>
    <div class="dialog dialog--sm quiz accent-cyan" role="dialog" aria-modal="true" aria-label="Element-Quiz">
      <button type="button" class="close" id="quizClose" aria-label="Schließen">&times;</button>
      <p class="quiz__counter" id="quizCounter"></p>
      <div id="quizStage">
        <p class="quiz__prompt" id="quizPrompt"></p>
        <div class="quiz__options" id="quizOptions"></div>
        <p class="quiz__feedback" id="quizFeedback" aria-live="polite"></p>
        <button type="button" class="btn btn--primary btn--block quiz__next" id="quizNext" hidden></button>
      </div>
      <div class="quiz__result" id="quizResult" hidden>
        <div id="hamsterContainer"></div>
        <p class="quiz__score" id="quizScore"></p>
        <button type="button" class="btn btn--primary btn--block" id="quizRestart">Nochmal</button>
      </div>
    </div>
  </div>

  <!-- Erklär-Player: Schritt-für-Schritt-Erklärungen (js/explainer.js, Inhalte in js/explain/) -->
  <div class="overlay" id="explOverlay" hidden>
    <div class="dialog expl-dialog accent-cyan" role="dialog" aria-modal="true" aria-labelledby="explTitle">
      <button type="button" class="close" id="explClose" aria-label="Schließen">&times;</button>
      <header class="expl-dialog__head">
        <h2 class="expl-dialog__title" id="explTitle"></h2>
        <span class="muted" id="explSubtitle"></span>
      </header>
      <div class="expl">
        <div class="expl-stage">
          <svg id="explStage" viewBox="0 0 600 340" role="img" aria-label="Animation zur Erklärung"></svg>
        </div>
        <div class="expl-card">
          <div class="expl-card__head">
            <div class="expl-narrator" id="explHamster"></div>
            <div>
              <span class="eyebrow expl-card__step" id="explStepNo"></span>
              <h3 class="expl-card__title" id="explStepTitle"></h3>
            </div>
          </div>
          <div class="expl-steps" id="explSteps" aria-live="polite"></div>
          <div class="expl-nav">
            <button type="button" class="btn" id="explPrev">&#8592; Zurück</button>
            <div class="expl-dots" id="explDots" aria-hidden="true"></div>
            <button type="button" class="btn" id="explAgain" title="Nochmal abspielen" aria-label="Nochmal abspielen">&#8635;</button>
            <button type="button" class="btn btn--primary" id="explNext">Weiter &#8594;</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../lib/hamster/hamster.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/elements.js"></script>
  <script src="../data/quiz-periodensystem.js"></script>
  <script src="../js/periodensystem.js"></script>
  <script src="../js/explainer.js"></script>
  <script src="../js/explain/perioden.js"></script>
  <script src="../js/explain/lewis.js"></script>
  <script src="../js/explain/oktettregel.js"></script>
</body>
</html>
