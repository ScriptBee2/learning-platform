<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mathe – Termumformung</title>
  <link rel="stylesheet" href="../lib/katex/katex.min.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../lib/hamster/hamster.css">
  <link rel="stylesheet" href="../css/grundlagen.css">
</head>
<body class="page page--scroll page--with-sidebar">
  <a class="back" href="mathe.html">&#8592; Zurück</a>

  <header class="topbar">
    <h1 class="topbar__title">Mathematik Termumformung</h1>
  </header>

  <!-- Abschnitte und Regelkarten kommen aus data/mathe-termumformung.js -->
  <main class="container" id="sections"></main>

  <!-- Info-Panel rechts -->
  <aside class="sidebar" id="sidebar">
    <button type="button" class="sidebar__toggle" id="sidebarToggle" aria-label="Panel auf-/zuklappen" aria-controls="sidebar">&rsaquo;</button>
    <div class="sidebar__content">
      <section class="panel">
        <h2 class="panel__title">Lernkarten</h2>
        <div class="card-stack" id="cards"></div>
      </section>
      <section class="panel accent-amber">
        <h2 class="panel__title">Gemischtes Quiz</h2>
        <button type="button" class="btn btn--primary btn--block" id="quizBtn">Quiz starten</button>
      </section>
      <section class="panel accent-blue">
        <h2 class="panel__title">Übungsaufgaben</h2>
        <div class="ueb-filter">
          <select class="ueb-filter__select" id="uebTopic">
            <option value="">Alle Themen</option>
            <option value="ausklammern">Ausklammern</option>
            <option value="ausmultiplizieren">Ausmultiplizieren</option>
            <option value="faktorisieren">Faktorisieren</option>
            <option value="bruchterme">Bruchterme</option>
            <option value="wurzeln-vereinfachen">Wurzeln vereinfachen</option>
          </select>
          <div class="ueb-level" role="group" aria-label="Schwierigkeitsgrad">
            <button type="button" class="ueb-level__btn is-active" data-level="easy">Einfach</button>
            <button type="button" class="ueb-level__btn" data-level="medium">Mittel</button>
            <button type="button" class="ueb-level__btn" data-level="hard">Schwer</button>
          </div>
        </div>
        <button type="button" class="btn btn--primary btn--block" id="uebBtn">Üben starten</button>
      </section>
    </div>
  </aside>

  <!-- Detail-Dialog (Klick auf Regelkarte) -->
  <div class="overlay" id="detailOverlay" hidden>
    <div class="dialog dialog--lg bigcard" id="detailCard" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button type="button" class="close close--on-accent" id="detailClose" aria-label="Schließen">&times;</button>
      <div class="bigcard__title" id="detailTitle"></div>
      <div class="bigcard__body rule-detail" id="detailBody"></div>
    </div>
  </div>

  <!-- Lernkarten-Dialog (Seitenleiste) -->
  <div class="overlay" id="cardOverlay" hidden>
    <div class="dialog bigcard" id="bigcard" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
      <button type="button" class="close close--on-accent" id="cardClose" aria-label="Schließen">&times;</button>
      <div class="bigcard__title" id="cardTitle"></div>
      <div class="bigcard__body prose" id="cardBody"></div>
    </div>
  </div>

  <!-- Quiz-Dialog mit Hinweis-Panel daneben -->
  <div class="overlay" id="quizOverlay" hidden>
    <div class="quiz-layout" id="quizLayout">
      <div class="dialog quiz" id="quizBox" role="dialog" aria-modal="true" aria-labelledby="quizLead">
        <button type="button" class="close" id="quizClose" aria-label="Schließen">&times;</button>
        <div class="quiz__bar">
          <p class="quiz__counter" id="quizCounter"></p>
          <button type="button" class="btn btn--sm quiz__hint-btn" id="hintBtn" aria-expanded="false" aria-controls="hintPanel">&#128161; Hinweis</button>
        </div>
        <div id="quizStage">
          <p class="quiz__lead" id="quizLead"></p>
          <p class="quiz__prompt" id="quizPrompt"></p>
          <div class="quiz__options" id="quizOptions"></div>
          <p class="quiz__feedback" id="quizFeedback" aria-live="polite"></p>
          <button type="button" class="btn btn--primary btn--block quiz__next" id="quizNext" hidden></button>
        </div>
        <div class="quiz__result" id="quizResult" hidden>
          <div id="hamsterContainer"></div>
          <p class="quiz__score" id="quizScore"></p>
          <button type="button" class="btn btn--primary btn--block" id="quizRestart">Nochmal</button>
        </div>
      </div>

      <!-- Hinweis: erklärt den Lösungsweg, verrät aber nicht das Ergebnis -->
      <aside class="dialog hint-panel" id="hintPanel" aria-labelledby="hintTitle" aria-live="polite" hidden>
        <button type="button" class="close" id="hintClose" aria-label="Hinweis schließen">&times;</button>
        <div class="hint-panel__head">
          <div class="hint-panel__hamster" id="hintHamster"></div>
          <div>
            <span class="eyebrow hint-panel__eyebrow">Hinweis</span>
            <h3 class="hint-panel__title" id="hintTitle"></h3>
          </div>
        </div>
        <div class="hint-panel__show">
          <span class="hint-panel__caption">So sieht das aus:</span>
          <ul class="math-lines" id="hintShow"></ul>
        </div>
        <p class="hint-panel__foot">Jetzt setz deine Zahlen ein!</p>
      </aside>
    </div>
  </div>

  <!-- Übungsaufgaben-Overlay -->
  <div class="overlay" id="uebOverlay" hidden>
    <div class="quiz-layout" id="uebLayout">
      <div class="dialog quiz" id="uebBox" role="dialog" aria-modal="true" aria-labelledby="uebLead">
        <button type="button" class="close" id="uebClose" aria-label="Schließen">&times;</button>
        <div class="quiz__bar">
          <p class="quiz__counter" id="uebCounter"></p>
          <button type="button" class="btn btn--sm quiz__hint-btn" id="uebSolutionBtn" aria-expanded="false" aria-controls="uebSolutionPanel">&#128221; Lösungsweg</button>
        </div>
        <div id="uebStage">
          <p class="quiz__lead" id="uebLead"></p>
          <p class="quiz__prompt" id="uebPrompt" tabindex="-1"></p>
          <div class="ueb-tipp">
            <button type="button" class="btn btn--sm quiz__hint-btn" id="uebTippBtn" aria-expanded="false">&#128161; Tipp</button>
            <p class="ueb-tipp__body" id="uebTippBody" hidden></p>
          </div>
          <button type="button" class="btn btn--primary btn--block quiz__next" id="uebNext" hidden></button>
        </div>
        <div class="quiz__result" id="uebResult" hidden>
          <div id="uebHamsterContainer"></div>
          <p class="quiz__score" id="uebScore"></p>
          <button type="button" class="btn btn--primary btn--block" id="uebRestart">Nochmal</button>
        </div>
      </div>

      <!-- Lösungsweg-Panel neben dem Dialog -->
      <aside class="dialog hint-panel" id="uebSolutionPanel" aria-label="Lösungsweg" hidden>
        <button type="button" class="close" id="uebSolutionClose" aria-label="Panel schließen">&times;</button>
        <div class="hint-panel__head">
          <div>
            <span class="eyebrow hint-panel__eyebrow">Lösungsweg</span>
            <h3 class="hint-panel__title">Schritt für Schritt</h3>
          </div>
        </div>
        <div class="hint-panel__show">
          <ol class="ueb-solution__steps" id="uebSolutionSteps"></ol>
        </div>
      </aside>
    </div>
  </div>

  <script src="../lib/katex/katex.min.js"></script>
  <script src="../lib/hamster/hamster.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/math.js"></script>
  <script src="../data/mathe-termumformung.js"></script>
  <script src="../data/quiz-termumformung.js"></script>
  <script src="../data/uebungen-termumformung.js"></script>
  <script src="../js/termumformung.js"></script>
  <script src="../js/uebungen.js"></script>
</body>
</html>
