<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 5 32 42">
  <!-- Abwärtspfeil für den Erklär-Player. Farbe über die group-Attribute (Indigo = --accent). -->
  <g class="ed-arrow" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Gerader Schaft mit runden Enden -->
    <line x1="24" y1="8" x2="24" y2="40" />
    <!-- Abgerundete Pfeilspitze -->
    <path d="M 11 30 L 24 44 L 37 30" />
  </g>
</svg>
