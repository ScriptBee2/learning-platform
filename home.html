<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lernzentrum</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="lib/hamster/hamster.css">
</head>
<body class="page page--hub">
  <header class="hero">
    <h1 class="hero__title">Mein Lernzentrum</h1>
    <p class="hero__subtitle">Wähle ein Fach und leg los</p>
  </header>

  <main class="choices">
    <a class="choice accent-mathe" href="html/mathe.html">
      <div class="choice__icon" aria-hidden="true">
        <svg viewBox="0 0 48 48" fill="currentColor" stroke="currentColor" stroke-width="3.6" stroke-linecap="round">
          <line x1="6" y1="13" x2="20" y2="13" fill="none"/>
          <line x1="13" y1="6" x2="13" y2="20" fill="none"/>
          <line x1="28" y1="13" x2="42" y2="13" fill="none"/>
          <line x1="8" y1="30" x2="18" y2="40" fill="none"/>
          <line x1="18" y1="30" x2="8" y2="40" fill="none"/>
          <line x1="28" y1="35" x2="42" y2="35" fill="none"/>
          <circle cx="35" cy="29" r="2.4" stroke="none"/>
          <circle cx="35" cy="41" r="2.4" stroke="none"/>
        </svg>
      </div>
      <h2 class="choice__title">Mathe</h2>
      <p class="choice__text">Rechenregeln, Brüche, Potenzen &amp; Wurzeln</p>
      <span class="badge badge--ready">Jetzt starten</span>
    </a>

    <a class="choice accent-chemie" href="html/chemie.html">
      <div class="choice__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9.5 3h5"/>
          <path d="M10 3v5.5L4.7 18.6A1.6 1.6 0 0 0 6.1 21h11.8a1.6 1.6 0 0 0 1.4-2.4L14 8.5V3"/>
          <circle cx="11.3" cy="11" r="0.9" fill="currentColor" stroke="none"/>
          <circle cx="12.6" cy="14" r="1" fill="currentColor" stroke="none"/>
          <circle cx="11" cy="4.6" r="0.8" fill="currentColor" stroke="none"/>
          <circle cx="13" cy="2" r="0.8" fill="currentColor" stroke="none"/>
        </svg>
      </div>
      <h2 class="choice__title">Chemie</h2>
      <p class="choice__text">Periodensystem, Oktettregel &amp; Bindungen</p>
      <span class="badge badge--ready">Jetzt starten</span>
    </a>
  </main>

  <footer class="page-foot">
    <p>Klicke auf eine Karte, um zu beginnen.</p>
  </footer>

  <script src="lib/hamster/hamster.js"></script>
  <script src="js/ui.js"></script>
  <script>
    UI.hamsterTips([
      "Lieber jeden Tag ein bisschen üben als einmal ganz viel.",
      "Erklär den Stoff jemand anderem. Was du erklären kannst, hast du verstanden.",
      "Nach 25 Minuten Lernen tut eine kurze Pause richtig gut.",
      "Fehler sind okay! Aus jeder falschen Antwort lernst du etwas."
    ]);
  </script>
</body>
</html>
